version: '3.8'
services:
  postgres:
    # gvector/pgvector:pg16 是 PostgreSQL 16 数据库镜像，额外预装了 pgvector 扩展（方便做向量检索）
    image: pgvector/pgvector:pg16 # 拉取镜像 pgvector/pgvector:pg16（第一次会下载）
    container_name: langgraph_postgres # 创建容器 langgraph_postgres
    environment: # 用环境变量初始化用户/密码/库：postgres / postgres / postgres
      POSTGRES_USER: postgres # 用户名
      POSTGRES_PASSWORD: postgres # 密码
      POSTGRES_DB: postgres # 库名
    ports:
      - "5432:5432" # 映射端口 5432 到宿主机 5432
    volumes:
      - ./pgdata:/var/lib/postgresql/data # 挂载数据卷 pgdata
    restart: unless-stopped